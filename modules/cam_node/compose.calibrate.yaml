# One-shot camera calibration (cam_node calibrate --out) for CAMERA_SERIAL:
#   docker compose -f compose.calibrate.yaml run --rm calibrate [options]
# - CAMERA_SERIAL comes from the shell or .env, like compose.cpu.yaml.
# - Reads config/charuco.json. Needs no camera config.
# - Writes ${CALIBRATION_DIR}/<CAMERA_SERIAL>.json, replacing an older file.
# - Stop the camera's cam-node container first. A camera opens only once.
# - Options go to calibrate, e.g. --frames 60 --timeout 60.
# - Uses the existing image. Add --build after run to rebuild it after code changes.
# All cameras: scripts/calibrate-all.sh.
name: cam-calibrate-${CAMERA_SERIAL}

services:
  calibrate:
    # Same image as compose.cpu.yaml. Calibration needs no GPU.
    image: safety-mesh-cam-node:dev-cpu
    build:
      context: .
      target: cpu
      additional_contexts:
        rerun: ../rerun
      args:
        BUILD_JOBS: ${BUILD_JOBS:-2}
        RERUN: ${RERUN:-ON}
    init: true
    # Options after the service name are appended.
    entrypoint:
      - /opt/cam_node/bin/cam_node
      - calibrate
      - --serial
      - ${CAMERA_SERIAL:?Set CAMERA_SERIAL to the camera to calibrate}
      - --board
      - /opt/cam_node/charuco.json
      - --out
      - /opt/cam_node/calibration/${CAMERA_SERIAL}.json
    # Same USB access as compose.cpu.yaml.
    device_cgroup_rules:
      - 'c 189:* rwm'
    volumes:
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
        bind:
          create_host_path: false
      - type: bind
        source: ./config/charuco.json
        target: /opt/cam_node/charuco.json
        read_only: true
        bind:
          create_host_path: false
      # Same host: CALIBRATION_DIR=../manager/config/cameras, where the
      # manager loads them. Files are owned by root on the host.
      - type: bind
        source: ${CALIBRATION_DIR:-./calibration}
        target: /opt/cam_node/calibration
        bind:
          create_host_path: true
