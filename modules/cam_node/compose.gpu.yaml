# TensorRT on an NVIDIA GPU. Selected with INFERENCE=gpu in .env.
# - Extends the cam-node service of compose.cpu.yaml and adds the GPU parts.
# - Needs the NVIDIA Container Toolkit on the host.
# - x86-64 only: the CUDA and TensorRT packages are amd64.

name: cam-${CAMERA_SERIAL:?Set CAMERA_SERIAL to name the project}

services:
  cam-node:
    extends:
      file: compose.cpu.yaml
      service: cam-node
    image: safety-mesh-cam-node:dev
    platform: linux/amd64
    build:
      target: gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE:-0}"]
              capabilities: [gpu]
