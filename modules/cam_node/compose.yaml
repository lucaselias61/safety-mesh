# One camera. INFERENCE picks cpu or gpu from compose.inference.yaml.
name: cam-node-${CAMERA_SERIAL:?Set CAMERA_SERIAL to name the project}

services:
  cam-node:
    # Image, build and GPU parts in compose.inference.yaml, cpu or gpu by INFERENCE.
    extends:
      file: compose.inference.yaml
      service: ${INFERENCE:-cpu}
    container_name: cam-node-${CAMERA_SERIAL:?Set CAMERA_SERIAL to name the container}
    # Camera, engine and viewer settings. cam_node reads them as env vars.
    env_file: .env
    # Here too, so an exported CAMERA_SERIAL wins over .env.
    environment:
      CAMERA_SERIAL: ${CAMERA_SERIAL}
