name: cam-${CAMERA_SERIAL:?Set CAMERA_SERIAL to name the project}

services:
  cam-node:
    container_name: cam-${CAMERA_SERIAL:?Set CAMERA_SERIAL to name the container}
    image: safety-mesh-cam-node:dev
    pull_policy: build
    platform: linux/amd64
    build:
      context: .
      # Shared Rerun library, outside this directory.
      additional_contexts:
        rerun: ../rerun
      args:
        BUILD_JOBS: ${BUILD_JOBS:-2}
        TENSORRT: ${TENSORRT:-ON}
        RERUN: ${RERUN:-ON}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    # Detections are logged continuously; rotation caps disk use at about 50 MB.
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CAMERA_SERIAL: ${CAMERA_SERIAL:-}
      # resolved from WORKDIR /opt/cam_node.
      CAM_NODE_CONFIG: ${CAM_NODE_CONFIG:-config/${CAMERA_SERIAL}.json}
      # Rerun viewer (modules/rerun); empty RERUN_URL = off.
      RERUN_URL: ${RERUN_URL:-}
      RERUN_IMAGE_FPS: ${RERUN_IMAGE_FPS:-5}
    # Makes host.docker.internal work on Linux (viewer on this host).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE:-0}"]
              capabilities: [gpu]
    # RSUSB needs USB access, including devices connected after container start.
    # This grants container access; host udev rules are configured separately.
    device_cgroup_rules:
      - 'c 189:* rwm'
    volumes:
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
        bind:
          create_host_path: false
      # Bind host ./models to /models; generated engines persist in ./models/.engines
      # across container removal and can be reused by containers sharing this directory.
      - type: bind
        source: ./models
        target: /models
        bind:
          create_host_path: false
      - type: bind
        source: ./${CAM_NODE_CONFIG:-config/${CAMERA_SERIAL}.json}
        target: /opt/cam_node/${CAM_NODE_CONFIG:-config/${CAMERA_SERIAL}.json}
        read_only: true
        bind:
          create_host_path: false
