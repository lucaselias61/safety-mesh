# cam-node image per inference backend: cpu or gpu, picked with INFERENCE.
# - Extended by compose.yaml and the root compose.yaml.
# - Not started on its own. No camera serial and no config here.
services:
  # OpenCV DNN on the CPU. Builds for the host's own architecture, including arm64.
  cpu:
    image: safety-mesh-cam-node:dev-cpu
    build:
      context: .
      # Final Dockerfile stage.
      target: cpu
      # Shared Rerun library, outside this directory.
      additional_contexts:
        rerun: ../rerun
      args:
        BUILD_JOBS: ${BUILD_JOBS:-2}
        RERUN: ${RERUN:-ON}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    # Detections are logged continuously; rotation caps disk use at about 50 MB.
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    # Makes host.docker.internal work on Linux (viewer on this host).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # RSUSB needs USB access, including devices connected after container start.
    # This grants container access; host udev rules are configured separately.
    device_cgroup_rules:
      - 'c 189:* rwm'
    volumes:
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
        bind:
          create_host_path: false
      # Bind host ./models to /models; generated engines persist in ./models/.engines
      # across container removal and can be reused by containers sharing this directory.
      - type: bind
        source: ./models
        target: /models
        bind:
          create_host_path: false
      # ChArUco board shared by all cameras, for the calibrate command.
      - type: bind
        source: ./config/charuco.json
        target: /opt/cam_node/charuco.json
        read_only: true
        bind:
          create_host_path: false

  # TensorRT on an NVIDIA GPU.
  # - Needs the NVIDIA Container Toolkit on the host.
  # - x86-64 only: the CUDA and TensorRT packages are amd64.
  gpu:
    extends: cpu
    image: safety-mesh-cam-node:dev
    platform: linux/amd64
    build:
      target: gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE:-0}"]
              capabilities: [gpu]
