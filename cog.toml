#:schema https://docs.cocogitto.io/cog-schema.json
# Requires Cocogitto 7 or later.
# Release one package: cog bump --package cam_node --auto
#                      cog bump --package manager --auto
# Release all changed packages: cog bump --auto

ignore_merge_commits = true

# Create cam_node-<version> and manager-<version> tags without a global tag.
tag_prefix = ""
monorepo_version_separator = "-"
generate_mono_repository_global_tag = false
generate_mono_repository_package_tags = true

[git_hooks.commit-msg]
script = '''#!/bin/sh
set -e
cog verify --file "$1"
'''

# Package hooks run in their package directory before the release commit.
# Each package keeps its version in include/version.hpp.
[monorepo.packages.cam_node]
path = "modules/cam_node"
pre_bump_hooks = [
  '''perl -pi -e 's/^(#define CAM_NODE_VERSION ")[^"]*"/${1}{{version}}"/' include/version.hpp''',
]

[monorepo.packages.manager]
path = "modules/manager"
pre_bump_hooks = [
  '''perl -pi -e 's/^(#define MANAGER_VERSION ")[^"]*"/${1}{{version}}"/' include/version.hpp''',
]
